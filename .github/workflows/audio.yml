name: Make Khmer audio
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ffmpeg" && cd "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ --strip-components=1 \
              || (sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg && exit 0)
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          fi
      - name: Sign in to Google Cloud (keyless)
        if: ${{ vars.STORAGE_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/196016401760/locations/global/workloadIdentityPools/github/providers/github
          service_account: egw-audio-uploader@egw-khmer.iam.gserviceaccount.com
      - name: Make the next chapter's audio
        env:
          GH_TOKEN: ${{ github.token }}
          KIRI_API_KEY: ${{ secrets.KIRI_API_KEY }}
          KIRI_VOICE: ${{ vars.KIRI_VOICE }}
          MONTHLY_LIMIT: ${{ vars.MONTHLY_LIMIT }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME }}
          PRIORITY_BOOKS: ${{ vars.PRIORITY_BOOKS }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
        run: python3 make_audio.py
      - name: Save the list of finished chapters
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add manifest.json state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Add chapter audio" && git push)
